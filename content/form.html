<html>
    <head>
        <title>Basic Structure</title>
        <link rel="stylesheet" type="text/css" href="../style/default.css">
    </head>
    <body>
        <h1>Form</h1>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="text.html">text</a></li>
            <li><a href="image.html">image</a></li>
            <li><a href="list.html">list</a></li>
            <li><a href="table.html">table</a></li>
            <li><a href="#">form</a></li>
        </ul>
        <form action="" method="post">
            <label for="txt">text box</label>
            <input type="text" id="txt" name="txt">
            <br> <!--  Line Break -->
            <label for="pwd">password</label>
            <input type="password" id="pwd" name="pwd">
            <br>
            <label for="eml">email</label>
            <input type="email" id="eml" name="eml">
            <br>
            <label for="chk1">check box 1</label>
            <input type="checkbox" id="chk1" name="chk1">
            <br>
            <label for="chk2">check box 2</label>
            <input type="checkbox" id="chk2" name="chk2">
            <br>
            <label for="chk3">check box 3</label>
            <input type="checkbox" id="chk3" name="chk3">
            <br>
            <label for="rdo1">radio 1</label>
            <input type="radio" id="rdo1" name="rdo">
            <br>
            <label for="rdo2">radio 2</label>
            <input type="radio" id="rdo2" name="rdo">
            <br>
            <label for="rdo3"> radio 3</label>
            <input type="radio" id="rdo3" name="rdo">
            <!-- radio put name the same to collect only one -->
            <br>
            <label for="num">number</label>
            <input type="number" id="num" name="num">
            <br>
            <label for="dat">date</label>
            <input type="date" id="dat" name="dat">
            <br>
            <label for="tim">time</label>
            <input type="time" id="tim" name="tim">
            <br>
            <label for="clr">color</label>
            <input type="color" id="clr" name="clr">
            <br>
            <label for="fil">file</label>
            <input type="file" id="fil" name="fil">
            <br>
            <label id="taa">text area</label>
            <textarea row="5"></textarea>
            <br>
            <label for="ddl">Drop down list</label>
            <select id="ddl" >
                <option>option 1</option>
                <option>option 2</option>
                <option>option 3</option>

            </select>
            <br>
            <label for="lst">list</label>
            <select id="lst" multiple> 
                <option>option 1</option>
                <option>option 2</option>
                <option>option 3</option>
                <option>option 4</option>
                <option>option 5</option>
            </select>
            <br>
            <input class="button" type="submit" id="sub" name="sub" value="ផ្ញើរ">
            <input class="button" type="reset" id="res" name="res" value="សារថ្មី">
            <input class="button" type="button" id="but" name="but" value="ប៊ូតុង">


        </form>
    </body>
</html>
