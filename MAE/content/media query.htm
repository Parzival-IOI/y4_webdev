<!DOCTYPE html>
<html>
   <head>
      <title>media query</title>
      <style>
         @media (min-width: 100px) and (max-width: 576px) {   body{background:dodgerblue}  }
         @media  (min-width: 577px) and (max-width: 768px) {   body{background:skyblue}  }
         @media  (min-width: 769px) and (max-width: 992px) {   body{background:pink}  }
         @media  (min-width: 993px) and (max-width: 1200px) {   body{background:orange} }
         @media  (min-width: 1201px)  {   body{background:violet} }

      </style>
   </head>
</html>
